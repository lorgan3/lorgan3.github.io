<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1418">
  <title>Chrono Decoder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="decoder-page">
  <a class="backlink" href="index.html"><button class="secondary">← Menu</button></a>
  <main>
    <div class="topbar">
      <img id="logo" alt="">
      <div class="tools">
        <button id="hintBtn" class="secondary">Hints</button>
        <button id="pauseBtn" class="secondary">Pauze</button>
        <button id="infoBtn" class="secondary">Uitleg</button>
        <button id="resetBtn" class="secondary">Reset</button>
      </div>
    </div>

    <section class="device">
      <div class="row">
        <div class="display"><span id="timer">60:00</span></div>
        <button id="startBtn">START</button>
        <div class="brand">CHRONO<br>DECODER</div>
      </div>
      <div class="progress">
        <span class="lamp"></span><span class="lamp"></span><span class="lamp"></span>
        <span id="partLabel">CODE 1 / 3</span>
      </div>
      <div class="slots">
        <button class="slot" aria-label="Opening 1"></button>
        <button class="slot" aria-label="Opening 2"></button>
        <button class="slot" aria-label="Opening 3"></button>
        <button class="slot" aria-label="Opening 4"></button>
      </div>
      <div id="pausedBanner" hidden>PAUZE</div>
    </section>

    <section class="tray">
      <div id="keys"></div>
      <div id="zoom"></div>
    </section>
  </main>
  <div id="flash" class="flash"></div>
  <div id="dialog" hidden></div>
  <script type="module" src="js/decoder.js"></script>
</body>
</html>
