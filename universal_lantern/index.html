    <meta name="theme-color" content="#b45309" media="(prefers-color-scheme: light)" />

    <meta name="description" content="Your LED strips, from your pocket." />
    <title>Universal Lantern</title>
    <script>
      // Pre-apply the theme override before the module loads, so there is no
      // flash of the wrong theme. Guarded: localStorage throws in some
      // private-mode configurations. Key must match src/lib/storage.ts.
      try {
        var stored = JSON.parse(localStorage.getItem('universal_lantern.settings.v1') || '{}').theme
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored
        }
      } catch (error) {
        // Follow the system.
      }
    </script>
