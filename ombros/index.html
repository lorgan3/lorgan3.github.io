<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b6cb0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a202c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Rain, minute by minute." />
    <title>Ombros</title>
    <script>
      // App.svelte applies the theme override in an effect, which is a quarter
      // of a second of the wrong theme on every load. That was survivable on a
      // near-empty page and is not once the boot gauge below fills the screen.
      // Guarded like storage.ts: localStorage throws outright in some
      // private-mode configurations, and an unguarded read here would take the
      // whole page down to prevent a flicker.
      try {
        var stored = JSON.parse(localStorage.getItem('ombros.settings.v1') || '{}').theme
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored
        }
      } catch (error) {
        // Defaults to following the system, which is what most people want.
      }
    </script>
    <style>:root{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light dark}@media (prefers-color-scheme:dark){:root{--lightningcss-light: ;--lightningcss-dark:initial}}:root[data-theme=light]{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light}:root[data-theme=dark]{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}#boot{background:var(--lightningcss-light,#fff)var(--lightningcss-dark,#14181f);justify-content:center;align-items:center;padding-bottom:10vh;transition:opacity .15s ease-out;display:flex;position:fixed;inset:0}#boot.gone{opacity:0;pointer-events:none}#boot .gauge{flex-direction:column;align-items:center;display:flex}#boot .rain{width:48px;height:60px;position:relative;overflow:hidden}#boot .rain i{width:3px;height:9px;animation:boot-fall .66s linear calc(-290ms + var(--n) * .165s) infinite;background:var(--lightningcss-light,#1f5f96)var(--lightningcss-dark,#79b8ea);border-radius:50%;position:absolute;top:0}#boot .rain i:first-child{--n:0;left:9px}#boot .rain i:nth-child(2){--n:1;left:30px}#boot .rain i:nth-child(3){--n:2;left:20px}#boot .rain i:nth-child(4){--n:3;left:37px}@keyframes boot-fall{0%{transform:translateY(-14px)}50%{transform:translateY(60px)}50.01%,to{transform:translateY(-14px)}}#boot .tube{border:1.5px solid var(--lightningcss-light,#d8dee8)var(--lightningcss-dark,#2c3543);border-radius:6px 6px 12px 12px;width:48px;height:144px;position:relative;overflow:hidden}#boot .level{color:var(--lightningcss-light,#1f5f96)var(--lightningcss-dark,#79b8ea);background:currentColor;animation:.7s ease-out forwards boot-fill;position:absolute;inset:0}@keyframes boot-fill{0%,5.71%{transform:translateY(100%)}29.29%{transform:translateY(75%)}52.86%{transform:translateY(50%)}76.43%{transform:translateY(25%)}to{transform:translateY(0)}}#boot .level:before{content:"";background:currentColor;border-radius:50%;height:8px;animation:.165s ease-in-out .7s infinite boot-ripple;position:absolute;top:-4px;left:0;right:0}@keyframes boot-ripple{0%,to{transform:scaleY(1)}50%{transform:scaleY(.72)}}@media (prefers-reduced-motion:reduce){#boot{display:none}}</style>
